name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOTOR_CONFIG: "-"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-publico.txt
      - name: System packages for Manim
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config fonts-liberation
      - name: Python packages
        run: python -m pip install -r requirements-publico.txt
      - name: Core tests (no network)
        run: python motor/pruebas_motor.py
      - name: Offline example
        run: python ejemplo/ejecutar.py
